name: EPG Güncelle
on:
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'
permissions:
  contents: write
concurrency:
  group: epg-update
  cancel-in-progress: false
jobs:
  scrape-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python epg_scraper.py
      - name: EPG ve raporu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml epg-report.json
          git diff --cached --quiet || git commit -m "EPG güncellendi"
          git push
